name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mypy, pydocstyle, pytest (Python 3.13), pac solution pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build and install shared packages
        run: |
          python -m build --wheel ./shared/lag-data-utils
          pip install ./shared/lag-data-utils/dist/*.whl

          python -m build --wheel ./shared/lag-service-kit
          pip install ./shared/lag-service-kit/dist/*.whl

      - name: Install service dependencies and dev/test tooling
        run: |
          pip install -r services/inventory-sync-engine/requirements.txt
          pip install ".[dev,test]"

      - name: Type-check (mypy --strict)
        run: >
          mypy
          shared/lag-data-utils/src
          services/inventory-sync-engine
          shared/lag-service-kit/src
          tests

      - name: Docstring convention (pydocstyle --convention=numpy)
        run: >
          pydocstyle --convention=numpy
          shared/lag-data-utils/src
          shared/lag-service-kit/src
          services/inventory-sync-engine/config.py
          services/inventory-sync-engine/dataverse_sync_runner.py
          services/inventory-sync-engine/defaults.py
          services/inventory-sync-engine/runners
          services/inventory-sync-engine/sources
          services/inventory-sync-engine/run_mock_sync.py
          services/inventory-sync-engine/test_connection.py
          tests

      - name: Test suite (tests/)
        run: >
          pytest tests/
          --cov=lag_data_utils
          --cov=lag_service_kit
          --cov=services
          --cov-report=term-missing
          --cov-fail-under=100

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pac CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack the Dataverse solution (pac CLI)
        run: >
          pac solution pack
          --folder platform/power-platform/LAGInventorySync/src
          --zipfile /tmp/LAGInventorySync.zip
          --packagetype Unmanaged
