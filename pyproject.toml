[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lag-portfolio"
version = "0.0.0"
description = "Repo-wide dev/test tooling, never published — see shared/lag-data-utils and shared/lag-service-kit for the real packages"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
    "types-requests>=2.31.0",
    "pydocstyle>=6.3.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "pip-tools>=7.4.0",
]
test = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]

[tool.hatch.build.targets.wheel]
# No module content to package — this pyproject.toml exists only to host
# [project.optional-dependencies] via `pip install ".[dev,test]"`.
bypass-selection = true

[tool.mypy]
# pydantic-settings' BaseSettings sources required fields from the
# environment/.env at runtime, not from constructor args — without this
# plugin, mypy treats a zero-arg settings instantiation (e.g.
# InventorySyncSettings()) as a call-arg error, forcing a type: ignore
# at every such call site instead of understanding the actual pattern.
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
# For type-checking purposes only — this plugin's synthesized BaseSettings
# __init__ signatures use `X | Y` union syntax, which requires targeting
# 3.10+ here even though the project's actual .venv runtime is 3.9. No
# project source file uses 3.10-only syntax, so this doesn't change what
# actually executes; it only affects which syntax mypy itself accepts.
python_version = "3.10"
# Standalone dev/test mock-data generator — see its own module docstring
# for why it's outside this project's mypy --strict delivery contract.
exclude = ["(^|/)generate_mock_data\\.py$"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# services/inventory-sync-engine is a deployable service's script
# directory, never a pip-installed package — there is no real
# artifact for this to shadow. lag-data-utils and lag-service-kit are
# deliberately NOT listed here: both are real, separately-built
# packages, and adding their src/ paths would put them at the front
# of sys.path (pytest's own documented behavior for this option),
# silently shadowing whatever is actually pip-installed — causing a
# "testing the source tree instead of the shipped artifact" problem
# that should not be employed in production. building and installing
# real wheels in CI rather than editable-installing them.
pythonpath = [
    "services/inventory-sync-engine",
]
markers = [
    "acceptance: black-box tests proving a business requirement from README.md holds",
    "integration: cross-component tests exercising real classes across a mocked network boundary",
    "unit: isolated tests of a single class or function",
]
addopts = "--strict-markers"
