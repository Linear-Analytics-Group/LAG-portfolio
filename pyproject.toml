[tool.mypy]
# pydantic-settings' BaseSettings sources required fields from the
# environment/.env at runtime, not from constructor args — without this
# plugin, mypy treats a zero-arg settings instantiation (e.g.
# InventorySyncSettings()) as a call-arg error, forcing a type: ignore
# at every such call site instead of understanding the actual pattern.
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
# For type-checking purposes only — this plugin's synthesized BaseSettings
# __init__ signatures use `X | Y` union syntax, which requires targeting
# 3.10+ here even though the project's actual .venv runtime is 3.9. No
# project source file uses 3.10-only syntax, so this doesn't change what
# actually executes; it only affects which syntax mypy itself accepts.
python_version = "3.10"
# Standalone dev/test mock-data generator — see its own module docstring
# for why it's outside this project's mypy --strict delivery contract.
exclude = ["(^|/)generate_mock_data\\.py$"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "shared/lag-data-utils/src",
    "shared/lag-service-kit/src",
    "services/inventory-sync-engine",
]
markers = [
    "acceptance: black-box tests proving a business requirement from README.md holds",
    "integration: cross-component tests exercising real classes across a mocked network boundary",
    "unit: isolated tests of a single class or function",
]
addopts = "--strict-markers"
