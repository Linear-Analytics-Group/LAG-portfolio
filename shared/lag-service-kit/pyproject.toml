[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lag-service-kit"
version = "1.1.0"
description = "Shared configuration, logging, and data-ingestion scaffolding for Linear Analytics Group services"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jeff Perkinson", email = "jeff@linearanalyticsgroup.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    "lag-data-utils>=1.0.0",
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.8.0",
    "requests>=2.31.0"
]

[project.urls]
Repository = "https://github.com/Linear-Analytics-Group/LAG-portfolio"

[tool.hatch.build.targets.wheel]
packages = ["src/lag_service_kit"]
