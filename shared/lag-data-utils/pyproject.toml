[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lag-data-utils"
version = "1.0.0"
description = "Enterprise Dataverse OData core pipeline utilities"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jeff Perkinson", email = "jeff@linearanalyticsgroup.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "msal>=1.22.0",
    "urllib3>=2.0.0"
]

[project.urls]
Repository = "https://github.com/Linear-Analytics-Group/LAG-portfolio"

[tool.hatch.build.targets.wheel]
packages = ["src/lag_data_utils"]
