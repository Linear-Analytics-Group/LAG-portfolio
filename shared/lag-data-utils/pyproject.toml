[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lag-data-utils"
version = "1.0.0"
description = "Enterprise Dataverse OData core pipeline utilities"
dependencies = [
    "requests>=2.31.0",
    "msal>=1.22.0",
    "urllib3>=2.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/lag_data_utils"]
